<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 候选 3「丝带书签」：米白纸底，一页笔记被李子紫丝带系成礼物，丝带的尾巴就是书签 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#EADCC2"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3190"/>
      <stop offset="0.45" stop-color="#A653BA"/>
      <stop offset="1" stop-color="#7C3190"/>
    </linearGradient>
    <linearGradient id="ribh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3190"/>
      <stop offset="0.45" stop-color="#A653BA"/>
      <stop offset="1" stop-color="#7C3190"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C47AD6"/>
      <stop offset="1" stop-color="#7C3190"/>
    </linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A4520" flood-opacity="0.28"/>
    </filter>
    <filter id="page" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5A4520" flood-opacity="0.28"/>
    </filter>
    <filter id="bow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3A1045" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#hl)"/>
    <g filter="url(#page)">
      <rect x="282" y="262" width="460" height="540" rx="40" fill="#FFFDF8"/>
    </g>
    <rect x="330" y="330" width="170" height="24" rx="12" fill="#3A2F22"/>
    <rect x="330" y="384" width="190" height="15" rx="7.5" fill="#E2D6C0"/>
    <rect x="330" y="416" width="160" height="15" rx="7.5" fill="#E2D6C0"/>
    <rect x="330" y="560" width="180" height="15" rx="7.5" fill="#E2D6C0"/>
    <rect x="330" y="592" width="150" height="15" rx="7.5" fill="#E2D6C0"/>
    <rect x="330" y="660" width="190" height="15" rx="7.5" fill="#E2D6C0"/>
    <rect x="330" y="692" width="130" height="15" rx="7.5" fill="#E2D6C0"/>
    <!-- 横丝带 -->
    <rect x="282" y="470" width="460" height="54" fill="url(#ribh)"/>
    <!-- 竖丝带，下端伸出纸外做书签，尾巴剪成燕尾 -->
    <path d="M566 262 H622 V872 L594 846 L566 872 Z" fill="url(#rib)"/>
    <!-- 蝴蝶结 -->
    <g filter="url(#bow)">
      <path d="M594 497 C540 420 452 418 448 470 C444 522 532 528 594 497 Z" fill="url(#loop)"/>
      <path d="M594 497 C648 420 736 418 740 470 C744 522 656 528 594 497 Z" fill="url(#loop)"/>
      <path d="M582 505 L540 600 L566 592 L578 622 L600 512 Z" fill="#7C3190"/>
      <path d="M606 505 L648 600 L622 592 L610 622 L588 512 Z" fill="#8E3DA3"/>
      <rect x="570" y="474" width="48" height="46" rx="16" fill="#B262C6"/>
      <path d="M470 462 C500 446 540 456 572 482" fill="none" stroke="#E3B6EE" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
