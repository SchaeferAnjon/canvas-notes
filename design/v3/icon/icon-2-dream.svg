<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 候选 2「夜里的书桌」：深海蓝底带光，一弯李子色的月亮，月亮下面一张笔记卡，几颗星 -->
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1D3F86"/>
      <stop offset="0.55" stop-color="#0B1B45"/>
      <stop offset="1" stop-color="#040A1C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#6E9BFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#6E9BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="1" r="0.6">
      <stop offset="0" stop-color="#A956C2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A956C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFD3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFD3FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#BFD3FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEBFF"/>
      <stop offset="1" stop-color="#D7A0E8"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="606" cy="372" r="150" fill="#fff"/>
      <circle cx="676" cy="318" r="134" fill="#000"/>
    </mask>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.40"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow1)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow2)"/>
    <polygon points="250,100 420,100 760,924 590,924" fill="url(#beam)"/>
    <circle cx="606" cy="372" r="150" fill="#D7A0E8" opacity="0.35" filter="url(#soft)" mask="url(#crescent)"/>
    <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
    <g fill="#FFFFFF">
      <path d="M330 300 l9 25 l25 9 l-25 9 l-9 25 l-9 -25 l-25 -9 l25 -9 z" opacity="0.95"/>
      <path d="M420 214 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z" opacity="0.75"/>
      <path d="M790 520 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" opacity="0.8"/>
      <circle cx="252" cy="452" r="5" opacity="0.6"/>
      <circle cx="806" cy="232" r="4" opacity="0.5"/>
    </g>
    <g transform="rotate(-7 512 650)" filter="url(#card)">
      <rect x="290" y="540" width="444" height="270" rx="40" fill="#F4F7FF"/>
      <rect x="336" y="590" width="190" height="26" rx="13" fill="#14234A"/>
      <rect x="336" y="646" width="330" height="16" rx="8" fill="#C9D3EA"/>
      <rect x="336" y="680" width="290" height="16" rx="8" fill="#C9D3EA"/>
      <rect x="336" y="714" width="310" height="16" rx="8" fill="#C9D3EA"/>
      <circle cx="690" cy="603" r="13" fill="#A956C2"/>
    </g>
  </g>
</svg>
